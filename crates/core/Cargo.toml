[package]
name = "slonview-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true
ts-rs.workspace = true
tracing.workspace = true
tokio-postgres = "0.7"
deadpool-postgres = "0.14"
tokio-postgres-rustls = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# OS credential store per platform (target-specific features; the resolver only enables a
# backend on its own OS). Without a backend feature keyring silently uses an in-memory mock.
keyring = "3"
directories = "6"
toml = "1"
futures-util = "0.3"
url = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
deadpool = { version = "0.13", features = ["managed", "rt_tokio_1"] }
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
semver = "1"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

# Secret Service over D-Bus (GNOME Keyring, KWallet, KeePassXC). Links libdbus-1 at runtime;
# building needs libdbus-1-dev + pkg-config. crypto-rust avoids an OpenSSL dependency.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"
rcgen = "0.14"
